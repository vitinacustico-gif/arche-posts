name: GTA 6 - agendar TikTok (Postiz)
on:
  workflow_dispatch:
  push:
    branches: [gta6]
    paths: ["gta6/calendario.json"]
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency: gta6-tiktok
jobs:
  agendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gta6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Postiz CLI
        run: npm install -g postiz
      - name: Agendar Reels no TikTok
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: |
          if [ -z "$POSTIZ_API_KEY" ]; then echo "Falta o segredo POSTIZ_API_KEY no repositório."; exit 1; fi
          python3 gta6/tiktok/agendar.py
      - name: Salvar o que foi agendado
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add gta6/tiktok/agendados.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "GTA 6: TikTok agendado" && git pull --rebase origin gta6 && git push origin HEAD:gta6)
